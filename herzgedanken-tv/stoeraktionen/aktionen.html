<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HerzGedanken Stör-Aktionen</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  /*
    Info-Karte „STÖR MICH!“: zeigt den Zuschauern, welches Geschenk welche Aktion auslöst.
    Durchsichtige Link-/Browser-Quelle, Bühne 1080x1920 (TikTok Hochformat), mit ?quer=1 1920x1080.
    Parameter:
      ?aktionen=🌹~Rose~„Wie bitte?!“|🍩~Donut~Applaus   eigene Liste (Emoji~Geschenk~Wirkung)
      ?x=40&y=260       Position der Karte in Pixeln
      ?seite=rechts     Karte rechts statt links
      ?dauer=4          Sekunden pro Aktion
  */
  :root { --red:#C8102E; --dark:#8E0B1F; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: grid; place-items: center; }
  #stage { position: relative; width: 1080px; height: 1920px; flex: none; transform-origin: center; font-family: 'Montserrat', sans-serif; }
  body.quer #stage { width: 1920px; height: 1080px; }

  #card { position: absolute; left: 36px; top: 270px; width: 400px; filter: drop-shadow(0 10px 26px rgba(0,0,0,.5)); }
  .head { display: flex; align-items: center; justify-content: space-between; background: var(--red); color: #fff;
    padding: 12px 18px 10px; font-weight: 900; font-size: 30px; letter-spacing: 2px; }
  .head small { font-size: 15px; font-weight: 700; letter-spacing: 1px; opacity: .9; }
  .body { position: relative; height: 150px; background: #fff; overflow: hidden; border-bottom: 6px solid var(--red); }
  .item { position: absolute; inset: 0; display: flex; align-items: center; gap: 16px; padding: 0 18px;
    opacity: 0; transform: translateX(60px); transition: transform .5s cubic-bezier(.2,.8,.2,1), opacity .5s; }
  .item.on { opacity: 1; transform: none; }
  .item.off { opacity: 0; transform: translateX(-60px); }
  .emoji { flex: none; width: 92px; height: 92px; display: grid; place-items: center; font-size: 64px; background: #FDECEF; border-radius: 50%; }
  .item.on .emoji { animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: scale(.4) rotate(-20deg) } 60% { transform: scale(1.15) rotate(6deg) } 100% { transform: none } }
  .txt { min-width: 0; }
  .gift { font-weight: 800; font-size: 24px; color: var(--red); text-transform: uppercase; letter-spacing: 1px; }
  .what { font-weight: 800; font-size: 31px; line-height: 1.12; color: #111; margin-top: 4px; }
  .dots { display: flex; gap: 8px; justify-content: center; padding: 8px 0 0; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.5); box-shadow: 0 0 0 2px rgba(200,16,46,.6); }
  .dots i.on { background: var(--red); box-shadow: 0 0 0 2px #fff; }
  body.capture #stage { transform: translate(-50%, -50%) !important; }

  /* Bühne immer mittig, auch wenn das Fenster kleiner ist */
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="stage">
  <div id="card">
    <div class="head"><span>😈 STÖR MICH!</span><small>SO GEHT'S</small></div>
    <div class="body" id="body"></div>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script>
const P = new URLSearchParams(location.search);
if (P.get('quer')) document.body.classList.add('quer');
if (P.get('capture')) document.body.classList.add('capture');
const W = P.get('quer') ? 1920 : 1080, H = P.get('quer') ? 1080 : 1920;
function fit() { if (P.get('capture')) return; const s = Math.min(innerWidth / W, innerHeight / H); document.getElementById('stage').style.transform = `translate(-50%, -50%) scale(${s})`; }
addEventListener('resize', fit); fit();

const card = document.getElementById('card');
if (P.get('y')) card.style.top = P.get('y') + 'px';
if (P.get('x')) card.style.left = P.get('x') + 'px';
if (P.get('seite') === 'rechts') { card.style.left = 'auto'; card.style.right = (P.get('x') || 36) + 'px'; }

// Standard-Aktionen (passend zur TikFinity-Einrichtung in der Anleitung)
const STANDARD = [
  ['🌹', 'Rose', '„Wie bitte?!“ – Faden verloren'],
  ['🫰', 'Fingerherz', 'Tröt! Die Hupe geht los'],
  ['🍩', 'Donut', 'Applaus für mich!'],
  ['💬', 'Kommentar mit !', 'Dein Text wird laut vorgelesen'],
  ['🌌', 'Galaxie', 'Fanfare + Konfetti'],
  ['❤️', 'Je 1000 Likes', 'Herzschlag für alle'],
];
const eigene = (P.get('aktionen') || '').split('|').map(s => s.split('~').map(x => x.trim())).filter(a => a.length === 3 && a[1]);
const AKTIONEN = eigene.length ? eigene : STANDARD;
const DAUER = Math.max(2, parseFloat(P.get('dauer') || '4')) * 1000;

const body = document.getElementById('body'), dots = document.getElementById('dots');
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
dots.innerHTML = AKTIONEN.map(() => '<i></i>').join('');
let i = -1;
function next() {
  i = (i + 1) % AKTIONEN.length;
  const [emo, gift, what] = AKTIONEN[i];
  const old = body.querySelector('.item.on');
  if (old) { old.classList.replace('on', 'off'); setTimeout(() => old.remove(), 600); }
  const el = document.createElement('div'); el.className = 'item';
  el.innerHTML = `<div class="emoji">${esc(emo)}</div><div class="txt"><div class="gift">${esc(gift)}</div><div class="what">${esc(what)}</div></div>`;
  body.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
  [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
}
document.fonts.ready.then(() => { next(); setInterval(next, DAUER); });
</script>
</body>
</html>

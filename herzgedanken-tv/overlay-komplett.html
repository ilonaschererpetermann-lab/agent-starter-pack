<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HerzGedanken Overlay komplett</title>
<style>
  /* Alle Einblendungen in einer Quelle (über die Kamera legen, 1080x1920, Sound an, immer aktiv):
     Stör-Karte, Nachrichten-Banner, Stör-Overlay (TikFinity), automatischer Einspieler.
     Parameter werden an alle Teile weitergegeben, z. B. ?test=1 */
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; pointer-events: none; }
</style>
</head>
<body>
<script>
const q = new URLSearchParams(location.search);
if (!q.get('ort')) q.set('ort', 'Mannheim|Stuttgart');
const qs = '?' + q.toString();
for (const src of ['stoeraktionen/aktionen.html', 'laufband/laufband.html', 'stoeraktionen/overlay.html', 'einspieler/auto.html']) {
  const f = document.createElement('iframe');
  f.src = src + qs; f.allow = 'autoplay'; f.setAttribute('allowtransparency', 'true');
  document.body.appendChild(f);
}
</script>
</body>
</html>

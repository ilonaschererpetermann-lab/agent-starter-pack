<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HerzGedanken 3D-Studio Hochformat</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Josefin+Sans:wght@300;400;600&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* 1080x1920-Bühne, per JS auf das Fenster skaliert */
  #gl { width: 1080px; height: 1920px; display: block; transform-origin: center; flex: none; }
</style>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<script src="assets/wall-data.js"></script>
<script>
const P = new URLSearchParams(location.search);
if (!P.get('vertical')) { P.set('vertical', '1'); history.replaceState(null, '', '?' + P); }
function fit() { if (P.get('capture')) return; const s = Math.min(innerWidth / 1080, innerHeight / 1920); document.getElementById('gl').style.transform = `scale(${s})`; }
addEventListener('resize', fit); fit();
</script>
<script src="studio.bundle.js"></script>
</body>
</html>
